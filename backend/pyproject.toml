[project]
name = "spaceday-workshop-backend"
version = "0.1.0"
description = "Music recommendation workshop backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.110.2",
  "uvicorn[standard]==0.29.0",
  "pydantic==2.7.1",
  "pydantic-settings==2.3.4",
  "numpy==1.26.4",
  "python-multipart==0.0.9",
]

[project.optional-dependencies]
collaborative-build = [
  "pandas>=2.2,<3",
  "pyarrow>=15,<24",
  "scipy>=1.12,<2",
]
dev = [
  "pytest==8.2.2",
  "pytest-asyncio==0.23.7",
  "httpx==0.27.0",
  "anyio==4.4.0",
]
language = [
  "onnxruntime==1.18.1",
  "transformers==4.41.2",
  "tokenizers==0.19.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
